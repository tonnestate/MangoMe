[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mangome-mcp"
version = "0.2.1"
description = "Canonical operational memory for multi-agent work: document store, work graph, state machine, evidence, verification, and compact semantic transport"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "MangoMe contributors"}]
keywords = [
  "mcp", "model-context-protocol", "mongodb", "multi-agent", "project-management",
  "agent-state", "contracts", "provenance", "work-graph", "ai-agents", "agent-handoff",
  "context-engineering", "verification", "agentic-ai", "semantic-compression", "interlingua"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2.7,<3",
  "pymongo>=4.10,<5",
  "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
mangome = "mangome.cli:main"
mangome-mcp = "mangome.mcp_server:main"

[project.urls]
Homepage = "https://github.com/tonnestate/MangoMe"
Repository = "https://github.com/tonnestate/MangoMe"
Issues = "https://github.com/tonnestate/MangoMe/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mangome*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
mangome = ["skill/SKILL.md"]
